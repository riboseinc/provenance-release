name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck, test, pin verification, and dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - Typecheck
        run: npm run typecheck

      - name: Gate 2 - Unit and ecosystem fixture tests
        run: npm test

      - name: Gate 3 - Build, pin verification, and dry-run
        run: npm run build
